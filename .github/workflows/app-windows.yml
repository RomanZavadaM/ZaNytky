name: App Windows build

# Manual run only: builds the desktop application for Windows and keeps the
# installers and a portable zip as a downloadable artifact (7 days). Nothing
# is published.
on:
  workflow_dispatch:

jobs:
  windows:
    name: ZaNytky app (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm install --no-audit --no-fund
      # own icon set (replaces the placeholder icons) generated from icon-source.png
      - run: npx tauri icon icon-source.png
      # web view runtime goes into the installers too (resource folder `webview2` next to the program)
      - name: Web view runtime for the installers
        shell: pwsh
        working-directory: .
        run: |
          $runtime = Get-ChildItem "C:\Program Files (x86)\Microsoft\EdgeWebView\Application" -Directory |
            Where-Object { $_.Name -match '^\d+\.' } | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          if (-not $runtime) { throw "WebView2 runtime not found on the runner" }
          Copy-Item $runtime.FullName app\src-tauri\webview2-runtime -Recurse
      - run: npm run tauri build -- --config src-tauri/tauri.bundled-webview.conf.json
      - name: Installer smoke test (silent install, own web view runtime)
        shell: pwsh
        working-directory: .
        run: |
          $setup = Get-ChildItem app\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'zn-installed'
          Start-Process $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait
          Get-ChildItem $dir | Select-Object -ExpandProperty Name
          if (-not (Test-Path "$dir\webview2\msedgewebview2.exe")) { throw "installer did not place webview2 next to the program" }
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          Start-Process $exe.FullName
          Start-Sleep -Seconds 20
          $own = (Resolve-Path "$dir\webview2").Path
          $used = Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" |
            Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($own, [StringComparison]::OrdinalIgnoreCase) }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process | Where-Object { $_.Path -like "$dir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $used) { throw "installed program did not use the bundled web view runtime" }
          Write-Host "OK: installed program uses the bundled web view runtime"
      - name: MSI contains the web view runtime
        shell: pwsh
        working-directory: .
        run: |
          $msi = (Get-ChildItem app\src-tauri\target\release\bundle\msi\*.msi | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'zn-msi'
          Start-Process msiexec.exe -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$target`"" -Wait
          $hit = Get-ChildItem $target -Recurse -Filter msedgewebview2.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $hit) { throw "MSI does not contain msedgewebview2.exe" }
          Write-Host "OK: MSI contains $($hit.FullName)"
      - name: Portable zip
        shell: pwsh
        working-directory: .
        run: |
          $dir = "ZaNytky-app-portable-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item app\src-tauri\target\release\zanytky-app.exe "$dir\ZaNytky.exe"
          Copy-Item LICENSE.md, COPYRIGHT.md, THIRD_PARTY_NOTICES.md $dir
          Copy-Item crates\zanytky-core\assets\OFL.txt "$dir\OFL-NotoSans.txt"
          Copy-Item docs\examples\sample-document.md "$dir\sample-document.md"
          # web view runtime next to the program: nothing has to be installed in Windows
          $runtime = Get-ChildItem "C:\Program Files (x86)\Microsoft\EdgeWebView\Application" -Directory |
            Where-Object { $_.Name -match '^\d+\.' } | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          if (-not $runtime) { throw "WebView2 runtime not found on the runner" }
          Write-Host "WebView2 runtime: $($runtime.Name)"
          Copy-Item $runtime.FullName "$dir\webview2" -Recurse
          if (-not (Test-Path "$dir\webview2\msedgewebview2.exe")) { throw "msedgewebview2.exe missing" }
          Set-Content -Path "$dir\README.txt" -Encoding UTF8 -Value @(
            "ZaNytky - портативна версія (без встановлення).",
            "Запустіть ZaNytky.exe. Нічого встановлювати не потрібно: середовище вікна лежить у папці webview2 поруч (не видаляйте її).",
            "Windows може показати попередження про невідомого видавця: збірка не підписана.",
            "Дані зберігаються лише в папці, яку ви оберете. Ключі й паролі зберігайте окремо."
          )
          # smoke test: the program must start and use ITS OWN web view runtime
          $proc = Start-Process "$dir\ZaNytky.exe" -PassThru
          Start-Sleep -Seconds 20
          $own = (Resolve-Path "$dir\webview2").Path
          $used = Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" |
            Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($own, [StringComparison]::OrdinalIgnoreCase) }
          Get-Process msedgewebview2, ZaNytky -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $used) { throw "ZaNytky did not start with the bundled web view runtime" }
          Write-Host "OK: bundled web view runtime in use ($(@($used).Count) processes)"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash | Out-File "$dir.zip.sha256" -Encoding ascii
          Get-Content "$dir.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ZaNytky-app-windows-x64
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            ZaNytky-app-portable-windows-x64.zip
            ZaNytky-app-portable-windows-x64.zip.sha256
          retention-days: 7
