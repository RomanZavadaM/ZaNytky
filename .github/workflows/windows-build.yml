name: Windows build

# Manual run only: builds zanytky.exe and keeps it as a downloadable artifact
# (7 days). Nothing is published.
on:
  workflow_dispatch:

jobs:
  windows:
    name: zanytky.exe (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p zanytky-cli
      - name: Smoke test
        run: .\target\release\zanytky.exe help
      - name: Package
        shell: pwsh
        run: |
          $dir = "ZaNytky-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target\release\zanytky.exe $dir
          Copy-Item LICENSE.md, COPYRIGHT.md, THIRD_PARTY_NOTICES.md $dir
          Copy-Item crates\zanytky-core\assets\OFL.txt "$dir\OFL-NotoSans.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash | Out-File "$dir.zip.sha256" -Encoding ascii
          Get-Content "$dir.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ZaNytky-windows-x64
          path: |
            ZaNytky-windows-x64.zip
            ZaNytky-windows-x64.zip.sha256
          retention-days: 7
